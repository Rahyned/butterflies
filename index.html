<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterflies</title>
    <style>
      #splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: #EAEEEF;
        background-image:
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 14px,
            rgba(31, 46, 90, 0.04) 14px,
            rgba(31, 46, 90, 0.04) 15px
          );
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #splash-overlay img {
        width: 260px;
        height: auto;
      }
      #splash-overlay .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(31, 46, 90, 0.15);
        border-top-color: #1F2E5A;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash-overlay">
      <img src="/logo-nombre.png" alt="Butterflies" />
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
